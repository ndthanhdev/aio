# One project per worktree (`main`, or the linked worktree's folder name), so
# worktrees don't share containers or volumes.
name: __REPO__-${WORKTREE:-main}

# Services publish a loopback port that Docker picks; the compose-up task
# routes a portless hostname to it, for example https://__APP__.__REPO__.localhost.
# New services also need an entry in `services` in compose-env.ts.
services:
  __APP__:
    build:
      context: ../..
      dockerfile: etc/docker/Dockerfile
      args:
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    working_dir: /workspace
    command:
      - bash
      - -lc
      - yarn install && moon run __APP__:dev -- --host 0.0.0.0 --port __APP_PORT__
    ports:
      - "127.0.0.1::__APP_PORT__"
    environment:
      # Keeps Yarn's install state with the container's node_modules volume
      # instead of overwriting the host's `.yarn/install-state.gz`.
      YARN_INSTALL_STATE_PATH: /workspace/node_modules/.yarn-install-state.gz
    volumes:
      - ../..:/workspace
      # Keep the container's dependencies and build caches separate from the
      # host checkout so a host dev server and this service don't clash.
      # The mount points must already exist in the checkout, otherwise Docker
      # creates them on the host owned by root; the compose-up task creates them.
      - node_modules:/workspace/node_modules
      - yarn_cache:/home/dev/.yarn/berry
      - moon_cache:/workspace/.moon/cache
      - app_cache:/workspace/__APP_DIR__/.cache
      - app_node_modules:/workspace/__APP_DIR__/node_modules

volumes:
  node_modules: {}
  yarn_cache: {}
  moon_cache: {}
  app_cache: {}
  app_node_modules: {}
